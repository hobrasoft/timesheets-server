<div id="spinner" class="spinner-border screen-spinner" style="width: 3em; height: 3em;" role="status"></div>

<div class="container">
    <h2>Attendance - present employees</h2>
    <div class="row">
        <div class="col">
            <h4>Present</h4>
            <table class="table table-bordered table-hover">
                <thead>
                    <tr class="table-info">
                        <th syle="text-align:right;">Name</th>
                        <th syle="text-align:right;">Arrived</th>
                    </tr>
                </thead>
                <tbody id="tbody-p">
                    <tr id="template-p" style="display:none;"><td><a class="name"></a></td><td class="time"></td></tr>
                </tbody>
            </table>
        </div>
        <div class="col">
            <h4>Absent</h4>
            <table class="table table-bordered table-hover">
                <thead>
                    <tr class="table-info">
                        <th syle="text-align:right;">Name</th>
                        <th syle="text-align:right;">Leaved</th>
                    </tr>
                </thead>
                <tbody id="tbody-a">
                    <tr id="template-a" style="display:none;"><td><a class="name"></a></td><td class="time"></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
$(document).ready(function(){
    var api = new Api();
    api.onFinished = function(result){
        $('#list-present').empty();
        $('#list-absent').empty();
        for (var i=0; i<result.length; i++) {
            const template = result[i].present ? "#template-p" : "#template-a";
            const tbody = result[i].present ? "#tbody-p" : "#tbody-a";
            var x = $(template).clone();
            var href="attendance-checklist.shtml?employee="+result[i].employee.employee;
            x.find('.name').attr("href", href);
            x.find(".name").html(result[i].employee.firstname + ' ' + result[i].employee.surname);
            x.find(".time").html(result[i].date.formatYYYYMMDDHHMM());
            $(tbody).append(x);
            x.show();
            }
        $('#spinner').hide();
    };
    api.attendancePresent();
});
</script>
