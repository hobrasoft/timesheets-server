<!-- #include '/inc/navbar.html' -->

<div id="spinner" class="spinner-border screen-spinner" style="width: 3em; height: 3em;" role="status"></div>

<div class="container">
    <h2 id="current-description">Overview</h2>
    <h4>Time: <span id="sum-time"></span> Price: <span id="sum-price"></h4>

    <table class="table table-bordered table-hover">
    <thead>
    <tr class="table-info">
        <th></th>
        <th>Description</th>
        <th style="text-align: right;">Count</th>
        <th style="text-align: right;">Time</th>
        <th style="text-align: right;">Price</th>
    </tr>
    </thead>
    <tbody id="tbody">
    <tr id="template-category" style="display: none;">
        <td><input type="checkbox" class="category-checkbox"></td>
        <td><span class="category-indent"></span><a href="#" class="category-description"></a></td>
        <td class="category-count" style="text-align: right;"></td>
        <td class="category-time" style="text-align: right;"></td>
        <td class="category-price" style="text-align: right;"></td>
    </tr>
    </tbody>
    <tfooter>
    <tr class="table-info">
        <td></td>
        <td></td>
        <td id="footer-sum-count" style="text-align: right;"></td>
        <td id="footer-sum-time" style="text-align: right;"></td>
        <td id="footer-sum-price" style="text-align: right;"></td>
        </tr>
    </tfooter>
    </table>
</div>

<!-- Add new status dialog -->
<div class="modal fade" id="add-new-status-dialog" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Append new status</h3>
            </div>
            <div class="modal-body">
                <p>This will add new status to all tickets in selected categories</p>
                <label for="next-status-text" class="form-label">Description</label>
                <input type="text" id="next-status-text" class="form-control"></input>
                <label for="next-status-id" class="form-label">Status</label>
                <select class="form-select" id="next-status-id"></select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="add-new-status-btn-add" class="btn btn-danger btn-ok">Add</button>
            </div>
        </div>
    </div>
</div>


<!-- Add new status dialog -->
<div class="modal fade" id="check-category-dialog" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Append new status</h3>
            </div>
            <div class="modal-body">
                <p>Please, select some non-empty categories</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>


<script>
function saveStatusFilter() {
    var statusFilter = new Array();
    $(".filter-item").each(function(){
        if ($(this).prop("checked")) { 
            statusFilter.push($(this).val());
            }
        });
    localStorage.setItem("statusFilter", JSON.stringify(statusFilter));
}


function onFilterItemChecked() {
    saveStatusFilter();
    loadData();
}


function addNewStatus() {
    $("#spinner").show();
    var status = $("#next-status-id").val();
    var description = $("#next-status-text").val();
    var categories = [];
    $(".category-checkbox").each(function(){
        if (!$(this).prop('checked')) { return; }
        var category = $(this).data("category");
        var count = $(this).data("count");
        if (category == null) { return; }
        if (category === "") { return; }
        if (count == null) { return; }
        if (count == "") { return; }
        if (count <= 0) { return; }
        if (categories.includes(category)) { return; }
        categories.push(category);
        });
    var statusFilter = JSON.parse(localStorage.getItem("statusFilter"));
    var pStatus = statusFilter.map(function(x) { if (x == null) { x = ''; } return x; });
    var api = new Api();
    api.appendStatus({ "categories": categories, "recent_status": pStatus, "status": status, "description": description});
    $("#add-new-status-dialog").modal("hide");
    setTimeout(loadData, 1000);

}


function onAddNewStatusClicked() {
    var categories = [];
    $(".category-checkbox").each(function(){
        if (!$(this).prop('checked')) { return; }
        var category = $(this).data("category");
        var count = $(this).data("count");
        if (category == null) { return; }
        if (category === "") { return; }
        if (count == null) { return; }
        if (count == "") { return; }
        if (count <= 0) { return; }
        if (categories.includes(category)) { return; }
        categories.push(category);
        });
    if (categories.length == 0) {
        $("#check-category-dialog").modal("show");
        return;
        }
    $("#add-new-status-dialog").modal("show");

    var api = new Api();
    api.onFinished = function(result) {
        for (var i=0; i<result.length; i++) {
            console.log("Add New Status Clicked " + JSON.stringify(result[i]));
            $("#next-status-id").append('<option value="'+result[i].status+'">'+result[i].description+'</option>');
            }
        $("#add-new-status-dialog").modal("show");
        };
    var statusFilter = JSON.parse(localStorage.getItem("statusFilter"));
    var pStatus = statusFilter.map(function(x) { if (x == null) { x = ''; } return x; });
    api.statuses(null, pStatus);
}


function loadData() {
    $("#spinner").show();
    $(".list-item").remove();
    var statusFilterSet = (localStorage.getItem("statusFilter") !== null);
    var statusFilter = JSON.parse(localStorage.getItem("statusFilter"));
    var api = new Api(); // categoriesOverview()
    api.onFinished = function(result) {
        for (var i=0; i< result.length; i++) {
            if (result[i].type == "DETAIL") {
                var x = $('#template-category').clone();
                var id_category_indent      = x.find(".category-indent");
                var id_category_description = x.find(".category-description");
                var id_category_time = x.find(".category-time");
                var id_category_price = x.find(".category-price");
                var id_category_count = x.find(".category-count");
                var id_category_checkbox = x.find(".category-checkbox");
                var indent = '';
                for (var d=0; d<result[i].depth; d++) {
                    indent += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'
                    }
                $(id_category_indent).html(indent);
                $(id_category_description).attr("href","index.shtml?category="+result[i].category);
                $(id_category_description).html(result[i].description);
                $(id_category_time).html(tonull((result[i].time*3600+0.5).formatHHMM()));
                $(id_category_price).html(tonull(result[i].price));
                $(id_category_count).html(tonull(result[i].tickets_count));
                $(id_category_checkbox).data('category', result[i].category);
                $(id_category_checkbox).data('count', result[i].tickets_count);
                $(x).attr("class","list-item");
                $("#tbody").append(x);
                $(x).show();
                }
            if (result[i].type = "SUM") {
                $("#footer-sum-time").html(tonull((result[i].time*3600+0.5).formatHHMM()));
                $("#footer-sum-price").html(tonull(result[i].price));
                $("#footer-sum-count").html(tonull(result[i].tickets_count));
                $("#sum-time").html((result[i].time*3600+0.5).formatHHMM());
                $("#sum-count").html(tonull(result[i].tickets_count));
                $("#sum-price").html(tonull(result[i].price));
                }
            }
        $("#spinner").hide();
        }
    api.categoriesOverview(statusFilter);

}


function loadFilter() {
    var apif = new Api();
    apif.onFinished = function(resultf) {
        for (var i=0; i < resultf.length; i++) {
            if (resultf[i].ignored) { continue; }
            var item_id = 'filter-'+resultf[i].status;
            var statusFilterSet = (localStorage.getItem("statusFilter") !== null);
            var statusFilter = JSON.parse(localStorage.getItem("statusFilter"));
            var checked = (statusFilterSet == false) ? ((resultf[i].can_be_run) ? 'checked="checked"' : '')
                        : (statusFilter.includes(resultf[i].status)) ? 'checked="checked"'
                        : '';
            $("#status-filter").append(
                '<li class="dropdown-item"><input class="filter-item" type="checkbox" value="'+resultf[i].status+'" id="'+item_id+'"'+checked+'></input>&nbsp;<label for="'+item_id+'">' + resultf[i].description + '</label></li>'
                );
            }
        $(".filter-item").change(onFilterItemChecked);
        saveStatusFilter();
        };
    apif.statuses();
}


$(document).ready(function(){
    $("#navbar-filter").show();
    $("#navbar-overview").show();
    $("#add-new-status-to-category").show();
    $("#add-new-status-to-category").click(onAddNewStatusClicked);
    $("#add-new-status-btn-add").click(addNewStatus);
    var currentCategory = ($.urlParam("category") == null) 
        ? parseInt(sessionStorage.getItem("currentCategory"))
        : parseInt($.urlParam("category"));
    sessionStorage.setItem("currentCategory", currentCategory);

    loadFilter();
    loadData();
    });
</script>
