<div class="container">
  <form>
    <div class="form-floating mb-3">
      <input type="number" class="form-control" id="year">
      <label for="year">Year</label>
    </div>
    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-generate">Generate</button>
  </form>
</div>
<script>
function goBack(){ window.location.replace('settings-workcalendars.shtml'); }
$(document).ready(function(){
    if (!userAdmin()) { $('#btn-generate').hide(); $('#year').prop('disabled',true); }
    $('#btn-cancel').click(function(){ goBack(); });
    $('#btn-generate').click(function(){
        if (!userAdmin()) return;
        var y = parseInt($('#year').val());
        var api = new Api();
        api.onFinished = function(){ goBack(); };
        api.generateWorkCalendar(y);
    });
});
</script>
