<div class="container">
    <form>
    <input type="hidden" id="department"></input>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="abbr"></input>
        <label for="abbr">Abbreviation</label>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="description"></input>
        <label for="description">Description</label>
    </div>

    <ul class="nav nav-tabs" id="dept-tabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-members-tab" data-bs-toggle="tab" data-bs-target="#tab-members" type="button" role="tab">Members</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-managers-tab" data-bs-toggle="tab" data-bs-target="#tab-managers" type="button" role="tab">Managers</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-members" role="tabpanel">
            <div class="row mb-3" id="emp-lists" style="display:none;">
                <div class="col">
                    <h5>In department</h5>
                    <ul class="list-group" id="list-in"></ul>
                </div>
                <div class="col">
                    <h5>Not in department</h5>
                    <ul class="list-group" id="list-out"></ul>
                </div>
            </div>
            <p id="list-help" class="text-muted" style="display:none;">Click employee to move between lists</p>
        </div>

        <div class="tab-pane fade" id="tab-managers" role="tabpanel">
            <div class="row mb-3" id="mgr-lists" style="display:none;">
                <div class="col">
                    <h5>Is manager</h5>
                    <ul class="list-group" id="list-manager"></ul>
                </div>
                <div class="col">
                    <h5>Is not manager</h5>
                    <ul class="list-group" id="list-notmanager"></ul>
                </div>
            </div>
            <p id="mgr-help" class="text-muted" style="display:none;">Click user to move between lists</p>
        </div>
    </div>

    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    <button type="button" class="btn btn-danger" id="btn-del" data-bs-toggle="modal" data-bs-target="#confirm-delete">Delete</button>
    </form>
</div>

<div class="modal fade" id="confirm-delete" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>This will delete the department.</h3>
            </div>
            <div class="modal-body">
                <p>Do you really want to delete the department?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="btn-delete" class="btn btn-danger btn-ok">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
function goBack() {
    window.location.replace('settings-departments.shtml');
}

$(document).ready(function(){
    if (!userAdmin())  {
        $("#btn-save").hide();
        $("#btn-del").hide();
        $("#abbr").prop('disabled', true);
        $("#description").prop('disabled', true);
    } else {
        $("#emp-lists").show();
        $("#list-help").show();
        $("#mgr-lists").show();
        $("#mgr-help").show();
    }
    var department = parseInt($.urlParam("department"));

    if (department == 0 || isNaN(department)) {
        $("#btn-del").hide();
    }

    var employees = [];
    var deptEmployees = [];
    var loadedEmployees = false;
    var loadedDeptEmployees = (department <= 0);

    var users = [];
    var deptManagers = [];
    var loadedUsers = false;
    var loadedDeptManagers = (department <= 0);

    function fillLists() {
        if (!(loadedEmployees && loadedDeptEmployees)) { return; }
        $("#list-in").empty();
        $("#list-out").empty();
        for (var i=0; i<employees.length; i++) {
            var li = $('<li class="list-group-item"></li>');
            li.attr('data-employee', employees[i].employee);
            li.text(employees[i].firstname + ' ' + employees[i].surname);
            if (deptEmployees.indexOf(employees[i].employee) >= 0) {
                $("#list-in").append(li);
            } else {
                $("#list-out").append(li);
            }
        }
    }

    function fillManagerLists() {
        if (!(loadedUsers && loadedDeptManagers)) { return; }
        $("#list-manager").empty();
        $("#list-notmanager").empty();
        for (var i=0; i<users.length; i++) {
            var li = $('<li class="list-group-item"></li>');
            li.attr('data-user', users[i].user);
            li.text(users[i].name);
            if (deptManagers.indexOf(users[i].user) >= 0) {
                $("#list-manager").append(li);
            } else {
                $("#list-notmanager").append(li);
            }
        }
    }

    if (department > 0) {
        var api = new Api();
        api.onFinished = function(result) {
            $("#department").val(result.department);
            $("#abbr").val(result.abbr);
            $("#description").val(result.description);
        };
        api.departments(department);

        var api3 = new Api();
        api3.onFinished = function(result) {
            for (var i=0; i<result.length; i++) {
                deptEmployees.push(result[i].employee);
            }
            loadedDeptEmployees = true;
            fillLists();
        };
        api3.departmentEmployees(department);

        var api4 = new Api();
        api4.onFinished = function(result) {
            for (var i=0; i<result.length; i++) {
                deptManagers.push(result[i].user);
            }
            loadedDeptManagers = true;
            fillManagerLists();
        };
        api4.departmentManagers(department);
    } else {
        loadedDeptEmployees = true;
        loadedDeptManagers = true;
    }

    var api2 = new Api();
    api2.onFinished = function(result) {
        employees = result;
        loadedEmployees = true;
        fillLists();
    };
    api2.employees();

    var apiUsers = new Api();
    apiUsers.onFinished = function(result) {
        users = result;
        loadedUsers = true;
        fillManagerLists();
    };
    apiUsers.users();

    $("#list-in").on('click', 'li', function(){
        $("#list-out").append(this);
    });
    $("#list-out").on('click', 'li', function(){
        $("#list-in").append(this);
    });

    $("#list-manager").on('click', 'li', function(){
        $("#list-notmanager").append(this);
    });
    $("#list-notmanager").on('click', 'li', function(){
        $("#list-manager").append(this);
    });

    function collectList(selector, attr) {
        var list = [];
        $(selector + ' li').each(function(){
            list.push(parseInt($(this).attr(attr)));
        });
        return list;
    }

    function saveEmployeeMappings(depId, cb) {
        var newSet = collectList('#list-in', 'data-employee');
        var toAdd = [];
        var toDel = [];
        for (var i=0; i<newSet.length; i++) {
            if (deptEmployees.indexOf(newSet[i]) === -1) { toAdd.push(newSet[i]); }
        }
        for (var i=0; i<deptEmployees.length; i++) {
            if (newSet.indexOf(deptEmployees[i]) === -1) { toDel.push(deptEmployees[i]); }
        }

        var pending = toAdd.length + toDel.length;
        if (pending === 0) { cb(); return; }
        function done() { if (--pending === 0) { cb(); } }
        toAdd.forEach(function(emp){
            var api = new Api();
            api.onFinished = done;
            api.saveDepartmentEmployee({department: depId, employee: emp});
        });
        toDel.forEach(function(emp){
            var api = new Api();
            api.onFinished = done;
            api.removeDepartmentEmployee(depId, emp);
        });
    }

    function saveManagerMappings(depId, cb) {
        var newSet = collectList('#list-manager', 'data-user');
        var toAdd = [];
        var toDel = [];
        for (var i=0; i<newSet.length; i++) {
            if (deptManagers.indexOf(newSet[i]) === -1) { toAdd.push(newSet[i]); }
        }
        for (var i=0; i<deptManagers.length; i++) {
            if (newSet.indexOf(deptManagers[i]) === -1) { toDel.push(deptManagers[i]); }
        }

        var pending = toAdd.length + toDel.length;
        if (pending === 0) { cb(); return; }
        function done() { if (--pending === 0) { cb(); } }
        toAdd.forEach(function(u){
            var api = new Api();
            api.onFinished = done;
            api.saveDepartmentManager({department: depId, user: u});
        });
        toDel.forEach(function(u){
            var api = new Api();
            api.onFinished = done;
            api.removeDepartmentManager(depId, u);
        });
    }

    $("#btn-cancel").click(function(event){
        goBack();
    });

    $("#btn-save").click(function(event){
        if (!userAdmin())  { return; }
        var data = { department: $("#department").val(), abbr: $("#abbr").val(), description: $("#description").val() };
        var api = new Api();
        api.onFinished = function(result) {
            var depId = data.department;
            if (depId == 0 || depId === "" || isNaN(depId)) {
                depId = result.key;
                $("#department").val(depId);
            }
            saveEmployeeMappings(depId, function(){
                saveManagerMappings(depId, goBack);
            });
        }
        api.saveDepartment(data);
    });

    $("#btn-delete").click(function(event){
        if (!userAdmin())  { return; }
        var department = $("#department").val();
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.removeDepartment(department);
    });
});
</script>
