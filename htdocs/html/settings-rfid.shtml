<div class="container">
    <form>
    <input type="hidden" id="rfid"></input>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="rfid_id"></input>
        <label for="rfid_id">RFID</label>
    </div>

    <div class="form-floating mb-3">
        <div class="form-check form-switch">
            <input type="checkbox" id="valid" class="form-check-input" checked="checked"></input>
            <label for="valid" class="form-check-label">Valid</label>
        </div>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="note"></input>
        <label for="note">Note</label>
    </div>

    <div class="form-floating mb-3">
        <select class="form-select" id="employee"></select>
        <label for="employee">Employee</label>
    </div>

    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    <button type="button" class="btn btn-danger" id="btn-del" data-bs-toggle="modal" data-bs-target="#confirm-delete">Delete</button>
    </form>
</div>

<div class="modal fade" id="confirm-delete" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>This will delete the RFID.</h3>
            </div>
            <div class="modal-body">
                <p>Do you really want to delete the RFID?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="btn-delete" class="btn btn-danger btn-ok">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
function goBack() {
    window.location.replace('settings-rfids.shtml');
}

$(document).ready(function(){
    if (!userAdmin())  {
        $("#btn-save").hide();
        $("#btn-del").hide();
        $("#rfid_id").prop('disabled', true);
        $("#valid").prop('disabled', true);
        $("#note").prop('disabled', true);
        $("#employee").prop('disabled', true);
    }
    var rfid = parseInt($.urlParam("rfid"));

    if (rfid == 0 || isNaN(rfid)) {
        $("#btn-del").hide();
    }

    var selectedEmployee = 0;
    if (rfid > 0) {
        var api = new Api();
        api.onFinished = function(result) {
            $("#rfid").val(result.rfid);
            $("#rfid_id").val(result.rfid_id);
            $("#valid").attr("checked", result.valid);
            $("#note").val(result.note);
            selectedEmployee = result.employee;
            $("#employee").val(selectedEmployee);
        };
        api.rfids(rfid);
    }

    var apiEmp = new Api();
    apiEmp.onFinished = function(result) {
        var optNone = $('<option></option>').attr('value', 0).text('No employee');
        $("#employee").append(optNone);
        for (var i=0; i<result.length; i++) {
            var opt = $('<option></option>').attr('value', result[i].employee).text(result[i].firstname + ' ' + result[i].surname);
            $("#employee").append(opt);
        }
        $("#employee").val(selectedEmployee);
    };
    apiEmp.employees();

    $("#btn-cancel").click(function(event){
        goBack();
    });

    $("#btn-save").click(function(event){
        if (!userAdmin())  { return; }
        var data = {
            rfid:      $("#rfid").val(),
            rfid_id:   $("#rfid_id").val(),
            valid:     $("#valid").prop("checked"),
            note:      $("#note").val(),
            employee:  parseInt($("#employee").val())
        };
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.saveRfid(data);
    });

    $("#btn-delete").click(function(event){
        if (!userAdmin())  { return; }
        var rfid = $("#rfid").val();
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.removeRfid(rfid);
    });
});
</script>
