<div id="spinner" class="spinner-border screen-spinner" style="width: 3em; height: 3em;" role="status"></div>

<div class="container">
    <h2 id="page-title"></h2>
    <div class="mb-2" id="month-nav" style="display:none;">
        <button id="prev-month" class="btn btn-sm btn-secondary">&lt;</button>
        <span id="selected-month" class="mx-2"></span>
        <button id="next-month" class="btn btn-sm btn-secondary">&gt;</button>
    </div>
    <table class="table table-bordered table-hover">
        <thead>
            <tr class="table-info">
                <th>Date</th>
                <th>Start</th>
                <th></th>
                <th>End</th>
                <th style="text-align: right;">Hours</th>
                <th style="text-align: right;">Cumulative</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <tr id="template-day" style="display: none;">
                <td class="day-date"></td>
                <td><span class="day-start-time"></span> <span class="day-start-desc"></span></td>
                <td><canvas class="day-canvas" width="265" height="18"></canvas></td>
                <td><span class="day-end-time"></span></td>
                <td class="day-rounded" style="text-align: right;"></td>
                <td class="day-cumulative" style="text-align: right;"></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
$(document).ready(function(){
    const etypes = {};
    var employee = $.urlParam('employee');
    var month = $.urlParam('month');
    if (employee === null) return;
    if (month === null) {
        month = localStorage.getItem('attendanceMonth');
        if (month === null) {
            var d = new Date();
            d.setDate(1);
            month = d.toISOString().substring(0,10);
        }
    }
    localStorage.setItem('attendanceMonth', month);

    function isoMonth(d) { 
        return d.getFullYear() + '-' + (d.getMonth()+1).pad(2); 
        }

    function setNavDates(){
        var d = new Date(month);
        $('#selected-month').text(isoMonth(d));
        var pm = new Date(d); pm.setMonth(d.getMonth()-1); pm.setDate(1);
        var nm = new Date(d); nm.setMonth(d.getMonth()+1); nm.setDate(1);
        $('#prev-month').data('month', pm.toISOString().substring(0,10));
        $('#next-month').data('month', nm.toISOString().substring(0,10));
        $('#month-nav').show();
        }

    function eventColor(event) {
        const defaultColor = "#208080";
        if (event == '') { return defaultColor; }
        const item = etypes[event];
        if (item.arrival)            { return "#909090"; }
        if (item.business_trip)      { return "#80ca80"; }
        if (item.compensatory_leave) { return "#90aa90"; }
        if (item.break_time)         { return "#a0a0a0"; }
        if (item.paid_obstacle)      { return "#90ca90"; }
        if (item.vacation)           { return "#60ea60"; }
        if (item.sick_leave)         { return "#ffb0b0"; }
        if (item.sick_care)          { return "#ffb0b0"; }
        if (item.doctor)             { return "#ffb0b0"; }
        if (item.unpaid_leave)       { return "#f0f060"; }
        return defaultColor;
        }

    function drawDayAxe(ctx) {
        for (var h=0; h<=24; h++) {
            ctx.beginPath();
            ctx.moveTo(h*11+0.5,0);
            ctx.lineTo(h*11+0.5, (h==6||h==14||h==22)?7:3);
            ctx.strokeStyle = '#080808';
            ctx.stroke();
            }
        } 

    function drawDay(canvas) {
        var ctx = canvas.getContext('2d');  
        ctx.fillStyle = "#f0f0f0";
        // ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillRect(0,0,canvas.width, canvas.height);
        drawDayAxe(ctx);
        }

    function drawInterval(canvas, it) {
        var ctx = canvas.getContext('2d');  
        
        var s = new Date(it.start_date);
        var e = new Date(it.end_date);
        var start = (s.getHours() + s.getMinutes()/60) * 11;
        var end   = (e.getHours() + e.getMinutes()/60) * 11;
        ctx.fillStyle = eventColor(it.start_event_type);
        ctx.fillRect(start, 0, end-start, 18);
        }

    function drawIntervals(canvas, intervals) {
        var ctx = canvas.getContext('2d');  
        drawDay(canvas);

        if (intervals && typeof intervals[Symbol.iterator] === 'function') {
            for (it of intervals) {
                drawInterval(canvas, it);
                }
          } else {
            drawInterval(canvas, intervals);
            }
        drawDayAxe(ctx);
        }

    $('#prev-month').click(function(e){
        e.preventDefault();
        month = $(this).data('month');
        localStorage.setItem('attendanceMonth', month);
        window.location.search = '?employee=' + employee + '&month=' + month;
        });
    $('#next-month').click(function(e){
        e.preventDefault();
        month = $(this).data('month');
        localStorage.setItem('attendanceMonth', month);
        window.location.search = '?employee=' + employee + '&month=' + month;
        });

    var apiE = new Api();
    apiE.onFinished = function(result) {
        for (const item of result) {
            etypes[item.event_type] = item;
            }
        var api = new Api();
        api.onFinished = function(result){
            var result0 = result[0];
            var d = new Date(result0.month);
            $('#page-title').html(result0.employee.firstname + ' ' + result0.employee.surname);
            month = d.toISOString().substring(0,10);
            setNavDates();

            // Naplníme strukturu dayDetails
            const dayDetails = {};
            let currentDet = null; 
            let currentKey = null;
            for (const item of result[0].days) {
                // První záznam v pořadí, nejsou naplněné předchozí hodnoty
                // Jako první by měl být přehledový záznam, nekontroluje se
                if (currentDet == null || currentKey == null) {
                    var date = new Date(item.start_date);
                    currentKey = date.toISOString().substring(0,10);
                    currentDet = [];
                    continue;
                    }
                // Další záznam po přehledovém je vždy detailní,
                // currentDet by měl existovat, ale pro jistotu zkontrolujeme 
                if (item.start_event !== 0 && currentDet != null) {
                    currentDet.push(item);
                    continue;
                    }
                // Další záznam po přehledovém je vždy detailní,
                // currentDet by měl existovat, ale co když ne?
                if (item.start_event !== 0 && currentDet == null) {
                    console.log("Chyba ve formátu dat, přehledový záznam není následován detailem");
                    continue;
                    }
                // Další přehledový záznam patří do dalšího dne
                // currentDet by měl existovat, ale pro jistotu zkontrolujeme 
                if (item.start_event === 0 && currentDet != null) {
                    dayDetails[currentKey] = currentDet;
                    var date = new Date(item.start_date);
                    currentKey = date.toISOString().substring(0,10);
                    currentDet = [];
                    continue;
                    }
                // Další přehledový záznam patří do dalšího dne
                // currentDet by měl existovat, ale co když ne?
                if (item.start_event === 0 && currentDet == null) {
                    console.log("Chyba ve formátu dat, předchozí přehledový záznam nebyl?!");
                    continue;
                    }
                }
            // Poslední záznam se v cyklu neuložil, takže dodatečně...
            dayDetails[currentKey] = currentDet;


            for (var i=0; i<result[0].days.length; i++) {
                var day = result[0].days[i];
                var date = new Date(day.start_date);
                var key = date.toISOString().substring(0,10);
                var dayDetail = (dayDetails && dayDetails[key]) ? dayDetails[key] : [];

                var x = $('#template-day').clone();
                var canvas = x.find('.day-canvas')[0]; 
                var is_summary_line = (day.start_event == 0);
                drawDay(canvas);
                drawIntervals(canvas, (is_summary_line) ? dayDetail : day);

                var start_date = day.start_date;
                var end_date   = day.end_date;
                if (is_summary_line && dayDetail.length != 0) {
                    start_date = dayDetail[0].start_date;
                    end_date   = dayDetail[dayDetail.length-1].end_date;
                    }
                x.find('.day-date').html(new Date(start_date).formatYYYYMMDDHHMM().substr(0,10));
                x.find('.day-start-time').html(new Date(start_date).formatHHMM());
                x.find('.day-start-desc').html(day.start_event_description);
                x.find('.day-end-time').html(new Date(end_date).formatHHMM());
                x.find('.day-rounded').html((Number(day.rounded_hours)*3600).formatHHMM());
                x.find('.day-cumulative').html((Number(day.cumulative_hours)*3600).formatHHMM());
                if (day.holiday) { x.addClass('table-warning'); }
                if (day.dow==0 || day.dow==6) { x.addClass('table-secondary'); }
                $('#tbody').append(x);
                $(x).show();
                }
            $('#spinner').hide();
            };
        api.attendanceChecklist(employee, month);
        };
    apiE.eventtypes();

});
</script>
