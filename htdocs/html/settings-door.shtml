<div class="container">
    <form>
    <input type="hidden" id="door"></input>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="description"></input>
        <label for="description">Description</label>
    </div>

    <div class="row mb-3">
        <div class="col">
            <h5>Can open door</h5>
            <ul class="list-group" id="list-can"></ul>
        </div>
        <div class="col">
            <h5>Cannot open door</h5>
            <ul class="list-group" id="list-cannot"></ul>
        </div>
    </div>
    <p class="text-muted">Click employee to move between lists</p>

    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    <button type="button" class="btn btn-danger" id="btn-del" data-bs-toggle="modal" data-bs-target="#confirm-delete">Delete</button>
    </form>
</div>

<div class="modal fade" id="confirm-delete" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>This will delete the door.</h3>
            </div>
            <div class="modal-body">
                <p>Do you really want to delete the door?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="btn-delete" class="btn btn-danger btn-ok">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
function goBack() {
    window.location.replace('settings-doors.shtml');
}

$(document).ready(function(){
    if (!userAdmin())  {
        $("#btn-save").hide();
        $("#btn-del").hide();
        $("#description").prop('disabled', true);
    }
    var door = parseInt($.urlParam("door"));

    if (door == 0 || isNaN(door)) {
        $("#btn-del").hide();
    }

    var employees = [];
    var doorEmployees = [];
    var loadedEmployees = false;
    var loadedDoorEmployees = (door <= 0);

    function fillLists() {
        if (!(loadedEmployees && loadedDoorEmployees)) { return; }
        $("#list-can").empty();
        $("#list-cannot").empty();
        for (var i=0; i<employees.length; i++) {
            var li = $('<li class="list-group-item"></li>');
            li.attr('data-employee', employees[i].employee);
            li.text(employees[i].firstname + ' ' + employees[i].surname);
            if (doorEmployees.indexOf(employees[i].employee) >= 0) {
                $("#list-can").append(li);
            } else {
                $("#list-cannot").append(li);
            }
        }
    }

    if (door > 0) {
        var api = new Api();
        api.onFinished = function(result) {
            $("#door").val(result.door);
            $("#description").val(result.description);
        };
        api.doors(door);

        var api3 = new Api();
        api3.onFinished = function(result) {
            for (var i=0; i<result.length; i++) {
                doorEmployees.push(result[i].employee);
            }
            loadedDoorEmployees = true;
            fillLists();
        };
        api3.doorEmployees(door);
    }
    else {
        loadedDoorEmployees = true;
    }

    var api2 = new Api();
    api2.onFinished = function(result) {
        employees = result;
        loadedEmployees = true;
        fillLists();
    };
    api2.employees();

    $("#list-can").on('click', 'li', function(){
        $("#list-cannot").append(this);
    });
    $("#list-cannot").on('click', 'li', function(){
        $("#list-can").append(this);
    });

    $("#btn-cancel").click(function(event){
        goBack();
    });

    function collectList(selector) {
        var list = [];
        $(selector + ' li').each(function(){
            list.push(parseInt($(this).attr('data-employee')));
        });
        return list;
    }

    function saveMappings(doorId) {
        var newSet = collectList('#list-can');
        var toAdd = [];
        var toDel = [];
        for (var i=0; i<newSet.length; i++) {
            if (doorEmployees.indexOf(newSet[i]) === -1) { toAdd.push(newSet[i]); }
        }
        for (var i=0; i<doorEmployees.length; i++) {
            if (newSet.indexOf(doorEmployees[i]) === -1) { toDel.push(doorEmployees[i]); }
        }

        var pending = toAdd.length + toDel.length;
        if (pending === 0) { goBack(); return; }
        function done() { if (--pending === 0) { goBack(); } }
        toAdd.forEach(function(emp){
            var api = new Api();
            api.onFinished = done;
            api.saveDoorEmployee({door: doorId, employee: emp});
        });
        toDel.forEach(function(emp){
            var api = new Api();
            api.onFinished = done;
            api.removeDoorEmployee(doorId, emp);
        });
    }

    $("#btn-save").click(function(event){
        if (!userAdmin())  { return; }
        var data = { door: $("#door").val(), description: $("#description").val() };
        var api = new Api();
        api.onFinished = function(result) {
            var doorId = data.door;
            if (doorId == 0 || doorId === "" || isNaN(doorId)) {
                doorId = result.key;
                $("#door").val(doorId);
            }
            saveMappings(doorId);
        }
        api.saveDoor(data);
    });

    $("#btn-delete").click(function(event){
        if (!userAdmin())  { return; }
        var door = $("#door").val();
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.removeDoor(door);
    });
});
</script>
