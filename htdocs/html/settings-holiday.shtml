<div class="container">
  <form>
    <div class="form-floating mb-3">
      <input type="date" class="form-control" id="date">
      <label for="date">Date</label>
    </div>
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="description">
      <label for="description">Description</label>
    </div>
    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    <button type="button" class="btn btn-danger" id="btn-del" data-bs-toggle="modal" data-bs-target="#confirm-delete">Delete</button>
  </form>
</div>
<div class="modal fade" id="confirm-delete" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h3>Delete holiday</h3></div>
      <div class="modal-body"><p>Do you really want to delete the holiday?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="btn-delete" class="btn btn-danger btn-ok">Delete</button>
      </div>
    </div>
  </div>
</div>
<script>
function goBack(){ window.location.replace('settings-holidays.shtml'); }
$(document).ready(function(){
    if (!userAdmin()) { $('#btn-save').hide(); $('#btn-del').hide(); $('#date').prop('disabled',true); $('#description').prop('disabled',true); }
    var date = $.urlParam('date');
    if (date === '') { $('#btn-del').hide(); } else {
        var api = new Api();
        api.onFinished=function(r){ $('#date').val(r.date); $('#description').val(r.description); $('#date').prop('disabled',true); };
        api.holidays(date);
    }
    $('#btn-cancel').click(function(){ goBack(); });
    $('#btn-save').click(function(){ if (!userAdmin()) return; var data={ date: $('#date').val(), description: $('#description').val() }; var api=new Api(); api.onFinished=function(){ goBack(); }; api.saveHoliday(data); });
    $('#btn-delete').click(function(){ if (!userAdmin()) return; var api=new Api(); api.onFinished=function(){ goBack(); }; api.removeHoliday($('#date').val()); });
});
</script>
