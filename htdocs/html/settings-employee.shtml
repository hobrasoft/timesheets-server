<div class="container">
    <form>
    <input type="hidden" id="employee"></input>

    <div>&nbsp;</div>
    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="firstname"></input>
        <label for="firstname">First name</label>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="surname"></input>
        <label for="surname">Surname</label>
    </div>
    <div class="form-floating mb-3">
        <select id="user" class="form-select"></select>
        <label for="user">User</label>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="work_hours_mode"></input>
        <label for="work_hours_mode">Work hours mode</label>
    </div>

    <div class="form-floating mb-3">
        <input type="text" class="form-control" id="rounding_interval"></input>
        <label for="rounding_interval">Rounding interval</label>
    </div>

    <div class="form-check form-switch mb-3">
        <input type="checkbox" id="saturdays_paid" class="form-check-input"></input>
        <label for="saturdays_paid" class="form-check-label">Saturdays paid</label>
    </div>
    <div class="form-check form-switch mb-3">
        <input type="checkbox" id="sundays_paid" class="form-check-input"></input>
        <label for="sundays_paid" class="form-check-label">Sundays paid</label>
    </div>
    <div class="form-check form-switch mb-3">
        <input type="checkbox" id="auto_breaks" class="form-check-input"></input>
        <label for="auto_breaks" class="form-check-label">Auto breaks</label>
    </div>
    <div class="form-check form-switch mb-3">
        <input type="checkbox" id="overtime_paid" class="form-check-input"></input>
        <label for="overtime_paid" class="form-check-label">Overtime paid</label>
    </div>

    <div class="form-floating mb-3">
        <div class="form-check form-switch">
            <input type="checkbox" id="active" class="form-check-input" checked="checked"></input>
            <label for="active" class="form-check-label">Active</label>
        </div>
    </div>

    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    <button type="button" class="btn btn-danger" id="btn-del" data-bs-toggle="modal" data-bs-target="#confirm-delete">Delete</button>
    </form>
</div>

<div class="modal fade" id="confirm-delete" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>This will delete the employee.</h3>
            </div>
            <div class="modal-body">
                <p>Do you really want to delete the employee?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="btn-delete" class="btn btn-danger btn-ok">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
function goBack() {
    window.location.replace('settings-employees.shtml');
}

$(document).ready(function(){
    if (!userAdmin())  {
        $("#btn-save").hide();
        $("#btn-del").hide();
        $("#employee").prop('disabled', true);
        $("#firstname").prop('disabled', true);
        $("#surname").prop('disabled', true);
        $("#active").prop('disabled', true);
        $("#user").prop('disabled', true);
        $("#work_hours_mode").prop('disabled', true);
        $("#rounding_interval").prop('disabled', true);
        $("#saturdays_paid").prop('disabled', true);
        $("#sundays_paid").prop('disabled', true);
        $("#auto_breaks").prop('disabled', true);
        $("#overtime_paid").prop('disabled', true);
        }
    var employee = parseInt($.urlParam("employee"));
    var selectedUser = 0;

    if (employee == 0 || isNaN(employee)) {
        $("#btn-del").hide();
        }

    if (employee > 0) {
        var api = new Api();
        api.onFinished = function(result) {
            $("#employee").val(result.employee);
            $("#firstname").val(result.firstname);
            $("#surname").val(result.surname);
            $("#active").attr("checked", result.active);
            selectedUser = result.user;
            $("#user").val(selectedUser);
            $("#work_hours_mode").val(result.work_hours_mode);
            $("#rounding_interval").val(result.rounding_interval);
            $("#saturdays_paid").prop("checked", result.saturdays_paid);
            $("#sundays_paid").prop("checked", result.sundays_paid);
            $("#auto_breaks").prop("checked", result.auto_breaks);
            $("#overtime_paid").prop("checked", result.overtime_paid);
            };
        api.employees(employee);
        }

    var apiUsers = new Api();
    apiUsers.onFinished = function(result) {
        var optNone = $('<option></option>').attr('value', 0).text('No user');
        $('#user').append(optNone);
        for (var i=0; i<result.length; i++) {
            var opt = $('<option></option>').attr('value', result[i].user).text(result[i].name);
            $('#user').append(opt);
        }
        $('#user').val(selectedUser);
    };
    apiUsers.users();
    $("#btn-cancel").click(function(event){
        goBack();
        });

    $("#btn-save").click(function(event){
        if (!userAdmin())  { return; }
        var data = {};
        data.employee = $("#employee").val();
        data.firstname = $("#firstname").val();
        data.surname = $("#surname").val();
        data.active = $("#active").prop("checked");
        data.user = parseInt($("#user").val());
        data.work_hours_mode = $("#work_hours_mode").val();
        data.rounding_interval = $("#rounding_interval").val();
        data.saturdays_paid = $("#saturdays_paid").prop("checked");
        data.sundays_paid = $("#sundays_paid").prop("checked");
        data.auto_breaks = $("#auto_breaks").prop("checked");
        data.overtime_paid = $("#overtime_paid").prop("checked");
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.saveEmployee(data);
        });

    $("#btn-delete").click(function(event){
        if (!userAdmin())  { return; }
        var employee = $("#employee").val();
        var api = new Api();
        api.onFinished = function() { goBack(); }
        api.removeEmployee(employee);
        });

    });
</script>
